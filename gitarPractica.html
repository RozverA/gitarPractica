<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гитарный тренажер</title><style>
:root{--bg:#0f1218;--panel:#171c25;--panel2:#202736;--text:#eef3ff;--muted:#9aa7bd;--accent:#7dd3fc;--accent2:#a78bfa;--good:#34d399;--bad:#fb7185;--warn:#fbbf24;--line:#2d3748;--r:18px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}html[data-theme=light]{--bg:#f4f7fb;--panel:#fff;--panel2:#eef3f9;--text:#111827;--muted:#5b6472;--accent:#0284c7;--accent2:#7c3aed;--good:#059669;--bad:#e11d48;--line:#d6dee9}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 12px 30px #0003}button,input,select{font:inherit}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:10px 14px;min-height:44px;cursor:pointer}.btn:hover{border-color:var(--accent)}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06111f;border:0;font-weight:800}.small{padding:7px 10px;min-height:36px}.active{outline:2px solid var(--accent)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.transport{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spacer{flex:1}.bpm{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;margin:12px 0}.num,select,input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px;min-height:42px}.num{width:92px;text-align:center;font-weight:800}.range{width:100%;accent-color:var(--accent)}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}.pill,.check{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.check{display:inline-flex;gap:7px;align-items:center;cursor:pointer;user-select:none}.check input{accent-color:var(--accent)}.beats,.strums{display:grid;gap:6px;margin-top:12px}.beat{min-height:56px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}.beat b{font-size:18px}.beat span{font-size:12px;color:var(--muted)}.beat.strong b{color:var(--accent)}.beat.current{background:color-mix(in srgb,var(--accent) 25%,var(--panel2));border-color:var(--accent);transform:translateY(-2px)}.strum{height:40px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;color:var(--muted)}.down{color:var(--accent)}.up{color:var(--good)}.mute{color:var(--bad)}.target{min-height:270px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at top,color-mix(in srgb,var(--accent) 14%,transparent),transparent 55%),var(--panel2);border:1px solid var(--line);border-radius:20px;margin-top:12px;padding:16px}.title{font-size:clamp(40px,9vw,84px);font-weight:900;line-height:1}.sub{font-size:clamp(16px,3vw,24px);color:var(--muted);margin-top:8px}.hint{font-size:14px;color:var(--muted);margin-top:10px}.progress{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}.warn{display:none;margin-top:10px;border:1px solid var(--warn);color:var(--warn);border-radius:14px;padding:10px}.warn.show{display:block}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{flex:1;min-width:110px}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.section:first-child{border-top:0;padding-top:0;margin-top:0}.section h2{font-size:18px;margin:0 0 10px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}.checks{display:flex;gap:8px;flex-wrap:wrap}.hidden,.adv{display:none}.dev .adv{display:block}.note{font-size:13px;color:var(--muted);margin-top:8px}.diagram{margin-top:14px;width:min(310px,100%)}.mini{margin-top:14px;width:min(460px,100%);display:grid;gap:5px}.cell{height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.dot{background:var(--accent);color:#06111f;font-weight:900}.scaleDot{background:color-mix(in srgb,var(--accent) 22%,var(--panel));color:var(--text)}.rootDot{border-color:var(--accent2);color:var(--accent2);font-weight:800}.sl{font-size:12px;color:var(--muted);text-align:center}@media(max-width:860px){.app{padding:10px}.grid{grid-template-columns:1fr}.card{padding:12px}.target{min-height:225px}.beat{min-height:48px}.beat b{font-size:16px}.strum{height:34px;font-size:22px}.bpm{grid-template-columns:82px 1fr}.num{width:82px}.tabs{position:sticky;top:0;background:var(--bg);padding-bottom:8px;z-index:2}.mini{gap:3px}.cell{height:28px;font-size:10px}}
</style></head><body><div class="app" id="app"><div class="top"><div class="brand">Guitar Practice Trainer<small>метроном • аккорды • баррэ • точки • гаммы</small></div><button class="btn small" id="theme">☀️ / 🌙</button></div><div class="grid"><main class="card"><div class="transport"><button class="btn primary" id="start">Старт</button><button class="btn" id="reset">Сброс</button><button class="btn" id="tap">Tap tempo</button><div class="spacer"></div><label class="check"><input type="checkbox" id="sound"> звук</label></div><div class="bpm"><input class="num" id="bpmN" type="number" min="20" max="300"><input class="range" id="bpmR" type="range" min="20" max="300"></div><div class="meta"><span class="pill" id="modePill"></span><span class="pill" id="gridPill"></span><span class="pill" id="switchPill"></span><span class="pill" id="cntPill"></span></div><div class="beats" id="beats"></div><div class="strums" id="strums"></div><div class="target"><div><div class="title" id="title">—</div><div class="sub" id="sub"></div><div class="hint" id="hint"></div><div id="diag"></div></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="warn" id="warn"></div></main><aside class="card"><div class="tabs"><button class="btn tab active" data-mode="open">1 Открытые</button><button class="btn tab" data-mode="barre">2 Баррэ</button><button class="btn tab" data-mode="point">3 Точка</button><button class="btn tab" data-mode="scale">4 Гаммы</button></div><div class="section"><h2>Метроном</h2><div class="row"><div class="field"><label>Сетка</label><select id="grid"><option value="q">1 2 3 4</option><option value="e">1 и 2 и 3 и 4 и</option><option value="t">1 три оль ...</option><option value="s">1 та и та ...</option></select></div><div class="field"><label>Смена каждые N сеток</label><input id="every" type="number" min="1" max="32"></div></div><div class="field"><label>Громкость</label><input id="vol" class="range" type="range" min="0" max="100"></div></div><div class="section"><h2>Бой</h2><div class="field"><label>Учебный пресет</label><select id="strum"><option value="none">Не показывать</option><option value="four">Четверка</option><option value="six">Шестерка</option><option value="eight">Восьмерка</option></select></div><label class="check" style="margin-top:10px"><input type="checkbox" id="dev"> режим опытных</label><div class="adv section"><div class="field"><label>Популярные бои</label><select id="advStrum"><option value="none">Не показывать</option><option value="pop">Шестерка: ↓ ↓↑ ↑↓↑</option><option value="rock">Восьмерка с глушением</option></select></div></div></div><div class="section panel" id="p-open"><h2>Открытые аккорды</h2><label class="check"><input type="checkbox" id="labels"> подписи</label><div class="checks" id="openChecks" style="margin-top:10px"></div></div><div class="section panel hidden" id="p-barre"><h2>Баррэ</h2><div class="checks"><label class="check"><input type="checkbox" id="maj"> мажор</label><label class="check"><input type="checkbox" id="min"> минор</label><label class="check"><input type="checkbox" id="nat"> чистые</label><label class="check"><input type="checkbox" id="sharp"> диезы</label><label class="check"><input type="checkbox" id="flat"> бемоли</label></div><div class="row"><span class="sl">Корневая струна:</span><div class="checks" id="rootChecks"></div></div><div class="row"><div class="field"><label>Максимальный лад</label><input id="maxFret" type="number" min="1" max="12"></div><label class="check"><input type="checkbox" id="details"> показывать лад/струну</label></div></div><div class="section panel hidden" id="p-point"><h2>Точка / перебор</h2><div class="row"><div class="field"><label>Лад от</label><input id="from" type="number" min="0" max="12"></div><div class="field"><label>Лад до</label><input id="to" type="number" min="0" max="12"></div><label class="check"><input type="checkbox" id="openStr"> открытые струны</label></div><div class="checks" id="stringChecks"></div><div class="row"><button class="btn small" id="allStrings">Выбрать все струны</button></div></div><div class="section panel hidden" id="p-scale"><h2>Гаммы</h2><div class="row"><div class="field"><label>Тоника</label><select id="scaleRoot"></select></div><div class="field"><label>Лад / гамма</label><select id="scaleType"><option value="minorPent">Минорная пентатоника</option><option value="naturalMinor">Натуральный минор</option><option value="dorian">Дорийский</option><option value="phrygian">Фригийский</option></select></div><div class="field"><label>Режим</label><select id="scaleMode"><option value="random">Случайные ноты</option><option value="updown">Вверх-вниз</option></select></div></div><div class="row"><div class="field"><label>Лад от</label><input id="scaleFrom" type="number" min="0" max="12"></div><div class="field"><label>Лад до</label><input id="scaleTo" type="number" min="0" max="12"></div><button class="btn small" data-range="0,5">0–5</button><button class="btn small" data-range="5,8">5–8</button><button class="btn small" data-range="0,12">0–12</button></div><div class="checks" id="scaleStringChecks"></div><div class="row"><button class="btn small" id="scaleAllStrings">Все струны</button><label class="check"><input type="checkbox" id="scaleMap"> карта гаммы</label></div><div class="note">Подписи нот используют общий тумблер “подписи” из режима открытых аккордов.</div></div><div class="section"><button class="btn small" id="clear">Сбросить настройки</button><div class="note">Настройки сохраняются в браузере. Пробел — старт/стоп.</div></div></aside></div></div><script>
(()=>{const $=id=>document.getElementById(id),KEY='guitarTrainerMaximV2';
const G={q:{n:'четверти',p:1,l:['1','2','3','4']},e:{n:'восьмые',p:2,l:['1','и','2','и','3','и','4','и']},t:{n:'триоли',p:3,l:['1','три','оль','2','три','оль','3','три','оль','4','три','оль']},s:{n:'шестнадцатые',p:4,l:['1','та','и','та','2','та','и','та','3','та','и','та','4','та','и','та']}};
const OPEN=[['Am','ля минор',[null,0,2,2,1,0],[0,0,2,3,1,0]],['A','ля мажор',[null,0,2,2,2,0],[0,0,1,2,3,0]],['C','до мажор',[null,3,2,0,1,0],[0,3,2,0,1,0]],['D','ре мажор',[null,null,0,2,3,2],[0,0,0,1,3,2]],['Dm','ре минор',[null,null,0,2,3,1],[0,0,0,2,3,1]],['E','ми мажор',[0,2,2,1,0,0],[0,2,3,1,0,0]],['Em','ми минор',[0,2,2,0,0,0],[0,2,3,0,0,0]],['G','соль мажор',[3,2,0,0,0,3],[2,1,0,0,0,3]]].map(a=>({id:a[0],ru:a[1],f:a[2],p:a[3]}));
const PC={C:0,D:2,E:4,F:5,G:9,A:9,B:11},ROOT={6:4,5:9,4:2},OPEN_PC={6:4,5:9,4:2,3:7,2:11,1:4},MIDI_OPEN={6:40,5:45,4:50,3:55,2:59,1:64},NAT=['A','B','C','D','E','F','G'],SH=['A#','C#','D#','F#','G#'],FL=['Bb','Db','Eb','Gb','Ab'],ALLROOTS=['A','A#','Bb','B','C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab'];
const NAMES_SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],RU={C:'до','C#':'до диез',D:'ре','D#':'ре диез',E:'ми',F:'фа','F#':'фа диез',G:'соль','G#':'соль диез',A:'ля','A#':'ля диез',B:'си'};
const SCALES={minorPent:{name:'минорная пентатоника',steps:[0,3,5,7,10]},naturalMinor:{name:'натуральный минор',steps:[0,2,3,5,7,8,10]},dorian:{name:'дорийский',steps:[0,2,3,5,7,9,10]},phrygian:{name:'фригийский',steps:[0,1,3,5,7,8,10]}};
const S={none:{},four:{q:['↓','↑','↓','×'],e:['↓','','↑','','↓','','×','']},six:{q:['↓','↑','↓','×'],e:['↓','','↓','↑','','↑','↓','']},eight:{q:['↓','↓','↑','↑'],e:['↓','','↓','↑','','↑','↓','↑']},pop:{e:['↓','','↓','↑','','↑','↓','↑']},rock:{e:['↓','','↓','↑','×','','↓','↑']}};
const D={theme:'dark',mode:'open',bpm:70,grid:'e',every:2,sound:true,vol:55,strum:'four',dev:false,advStrum:'none',labels:true,open:['Am','C','D','E','G'],maj:true,min:true,nat:true,sharp:false,flat:false,roots:[6,5],maxFret:5,details:true,from:1,to:5,openStr:false,strings:[1,2,3,4,5,6],scaleRoot:'A',scaleType:'minorPent',scaleMode:'random',scaleFrom:0,scaleTo:5,scaleStrings:[1,2,3,4,5,6],scaleMap:true};
let st=load(),run=false,timer=null,next=0,idx=0,cnt=0,audio=null,last='',target=null,taps=[],scaleSeq=[],scalePos=0,scaleDir=1;
function load(){try{return Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return Object.assign({},D)}}function save(){localStorage.setItem(KEY,JSON.stringify(st))}function cl(x,a,b){x=Number(x);return Math.max(a,Math.min(b,Number.isFinite(x)?x:a))}function rnd(a){return a[Math.floor(Math.random()*a.length)]}function grid(){return G[st.grid]||G.e}function interval(){return 60/st.bpm/grid().p}function pc(n){let m=n.match(/^([A-G])([#b]?)/),v=PC[m[1]];if(m[2]=='#')v++;if(m[2]=='b')v--;return(v+12)%12}function noteName(p){return NAMES_SH[(p+12)%12]}function ruNote(p){return RU[noteName(p)]||noteName(p)}function ru(r){return({A:'ля',B:'си',C:'до',D:'ре',E:'ми',F:'фа',G:'соль'})[r[0]]+(r.includes('#')?' диез':r.includes('b')?' бемоль':'')}
function warn(msg,btn){let w=$('warn');w.innerHTML=msg+(btn?' <button class="btn small" id="fix">Выбрать все</button>':'');w.classList.add('show');if(btn)setTimeout(()=>{let f=$('fix');if(f)f.onclick=()=>{if(st.mode=='scale')st.scaleStrings=[1,2,3,4,5,6];else st.strings=[1,2,3,4,5,6];choose();render()}},0)}function clearWarn(){$('warn').classList.remove('show');$('warn').innerHTML=''}
function checks(){$('openChecks').innerHTML=OPEN.map(c=>`<label class="check"><input type="checkbox" data-open="${c.id}"> ${c.id}</label>`).join('');$('rootChecks').innerHTML=[6,5,4].map(s=>`<label class="check"><input type="checkbox" data-root="${s}"> ${s}-я</label>`).join('');$('stringChecks').innerHTML=[1,2,3,4,5,6].map(s=>`<label class="check"><input type="checkbox" data-string="${s}"> ${s}-я</label>`).join('');$('scaleStringChecks').innerHTML=[1,2,3,4,5,6].map(s=>`<label class="check"><input type="checkbox" data-sstring="${s}"> ${s}-я</label>`).join('');$('scaleRoot').innerHTML=ALLROOTS.map(r=>`<option value="${r}">${r}</option>`).join('')}
function sync(){document.documentElement.dataset.theme=st.theme;$('app').classList.toggle('dev',st.dev);$('bpmN').value=$('bpmR').value=st.bpm;$('grid').value=st.grid;$('every').value=st.every;$('sound').checked=st.sound;$('vol').value=st.vol;$('strum').value=st.strum;$('dev').checked=st.dev;$('advStrum').value=st.advStrum;$('labels').checked=st.labels;document.querySelectorAll('[data-open]').forEach(i=>i.checked=st.open.includes(i.dataset.open));['maj','min','nat','sharp','flat'].forEach(id=>$(id).checked=st[id]);document.querySelectorAll('[data-root]').forEach(i=>i.checked=st.roots.map(Number).includes(+i.dataset.root));$('maxFret').value=st.maxFret;$('details').checked=st.details;$('from').value=st.from;$('to').value=st.to;$('openStr').checked=st.openStr;document.querySelectorAll('[data-string]').forEach(i=>i.checked=st.strings.map(Number).includes(+i.dataset.string));$('scaleRoot').value=st.scaleRoot;$('scaleType').value=st.scaleType;$('scaleMode').value=st.scaleMode;$('scaleFrom').value=st.scaleFrom;$('scaleTo').value=st.scaleTo;$('scaleMap').checked=st.scaleMap;document.querySelectorAll('[data-sstring]').forEach(i=>i.checked=st.scaleStrings.map(Number).includes(+i.dataset.sstring));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode==st.mode));document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));$('p-'+st.mode).classList.remove('hidden')}
function meta(){$('modePill').textContent={open:'Открытые',barre:'Баррэ',point:'Точка',scale:'Гаммы'}[st.mode];$('gridPill').textContent=grid().n;$('switchPill').textContent='смена: '+st.every+' сетк.';$('cntPill').textContent='сетка '+cnt+'/'+st.every;$('bar').style.width=Math.min(100,cnt/st.every*100)+'%'}
function beats(){let l=grid().l,n=l.length,key=st.dev?st.advStrum:st.strum,pat=(S[key]&&S[key][st.grid])||Array(n).fill('');$('beats').style.gridTemplateColumns=$('strums').style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;$('beats').innerHTML=l.map((x,i)=>`<div class="beat ${i%grid().p==0?'strong':''}" data-i="${i}"><b>${x}</b><span>${i+1}</span></div>`).join('');$('strums').innerHTML=pat.map(x=>`<div class="strum ${x=='↓'?'down':x=='↑'?'up':x=='×'?'mute':''}">${x||'·'}</div>`).join('')}
function hi(i){document.querySelectorAll('.beat').forEach((b,j)=>b.classList.toggle('current',j==i))}
function chordSvg(c){let w=260,h=190,L=34,T=28,sw=36,fh=30,s=`<svg class="diagram" viewBox="0 0 ${w} ${h}">`;for(let i=0;i<6;i++){let x=L+i*sw,m=c.f[i]==null?'×':c.f[i]==0?'○':'';s+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${T+fh*5}" stroke="currentColor" opacity=".45"/><text x="${x}" y="18" text-anchor="middle" fill="currentColor">${m}</text>`}for(let f=0;f<=5;f++){let y=T+f*fh;s+=`<line x1="${L}" y1="${y}" x2="${L+sw*5}" y2="${y}" stroke="currentColor" opacity="${f?'.35':'.9'}" stroke-width="${f?1:3}"/>`}c.f.forEach((fr,i)=>{if(fr>0&&fr<=5){let x=L+i*sw,y=T+(fr-.5)*fh;s+=`<circle cx="${x}" cy="${y}" r="11" fill="var(--accent)"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="#06111f" font-size="12" font-weight="800">${c.p[i]||''}</text>`}});return s+'</svg>'}
function scaleInfo(){let root=pc(st.scaleRoot),steps=SCALES[st.scaleType].steps,set=new Set(steps.map(x=>(root+x)%12));return{root,set,steps,name:SCALES[st.scaleType].name}}function scaleNotes(){let inf=scaleInfo(),a=cl(st.scaleFrom,0,12),b=cl(st.scaleTo,0,12);if(a>b)[a,b]=[b,a];let ss=st.scaleStrings.map(Number).filter(Boolean),arr=[];for(let s=6;s>=1;s--)if(ss.includes(s))for(let f=a;f<=b;f++){let p=(OPEN_PC[s]+f)%12;if(inf.set.has(p))arr.push({s,f,p,root:p==inf.root})}return arr.sort((a,b)=>(MIDI_OPEN[a.s]+a.f)-(MIDI_OPEN[b.s]+b.f)||b.s-a.s||a.f-b.f)}
function pointSvg(str,fret,useScale=false){let a=useScale?cl(st.scaleFrom,0,12):cl(st.from,0,12),b=useScale?cl(st.scaleTo,0,12):cl(st.to,0,12);if(a>b)[a,b]=[b,a];let cols=b-a+1,inf=useScale?scaleInfo():null,h=`<div class="mini" style="grid-template-columns:42px repeat(${cols},1fr)"><div></div>`;for(let f=a;f<=b;f++)h+=`<div class="sl">${f}</div>`;for(let s=6;s>=1;s--){h+=`<div class="sl">${s} стр</div>`;for(let f=a;f<=b;f++){let p=(OPEN_PC[s]+f)%12,d=s==str&&f==fret,inScale=useScale&&st.scaleMap&&inf.set.has(p),isRoot=useScale&&st.scaleMap&&p==inf.root,cls=d?'dot':inScale?(isRoot?'scaleDot rootDot':'scaleDot'):'',txt=d?(useScale?noteName(p):'●'):inScale?noteName(p):'';h+=`<div class="cell ${cls}">${txt}</div>`}}return h+'</div>'}
function barrePool(){let names=[];if(st.nat)names.push(...NAT);if(st.sharp)names.push(...SH);if(st.flat)names.push(...FL);let qs=[];if(st.maj)qs.push('');if(st.min)qs.push('m');let pool=[];for(let r of [...new Set(names)])for(let q of qs)for(let rs of st.roots.map(Number)){let f=(pc(r)-ROOT[rs]+12)%12;if(f==0)f=12;if(f<=st.maxFret)pool.push({id:r+q,r,q,rs,f,key:r+q+rs+f})}return pool}

function choose(){clearWarn();if(st.mode=='open'){let p=OPEN.filter(c=>st.open.includes(c.id));if(!p.length){warn('Не выбран ни один аккорд.');target={t:'—',s:'выбери аккорды',h:'Тренажер не стартовал'};draw();return false}let c=rnd(p);if(p.length>1&&c.id==last)c=rnd(p.filter(x=>x.id!=last));last=c.id;target={t:c.id,s:st.labels?c.ru:'',h:'Открытый аккорд',d:chordSvg(c)}}else if(st.mode=='barre'){let p=barrePool();if(!p.length){warn('Нет баррэ по текущим фильтрам.');target={t:'—',s:'нет вариантов',h:'Расширь фильтры'};draw();return false}let b=rnd(p);if(p.length>1&&b.key==last)b=rnd(p.filter(x=>x.key!=last));last=b.key;target={t:b.id,s:st.labels?ru(b.r)+(b.q=='m'?' минор':' мажор'):'',h:st.details?`баррэ от ${b.rs}-й струны • ${b.f} лад`:'баррэ'}}else if(st.mode=='point'){let ss=st.strings.map(Number).filter(Boolean);if(!ss.length){warn('Не выбрана ни одна струна.',true);target={t:'—',s:'выбери струны',h:'Тренажер не стартовал'};draw();return false}let a=cl(st.from,0,12),b=cl(st.to,0,12);if(a>b)[a,b]=[b,a];let fs=[];for(let f=a;f<=b;f++)if(st.openStr||f!=0)fs.push(f);if(!fs.length){warn('Нет ладов в диапазоне.');target={t:'—',s:'нет ладов',h:'Измени диапазон'};draw();return false}let str=rnd(ss),f=rnd(fs),k=str+'-'+f;if(ss.length*fs.length>1&&k==last)for(let i=0;i<8;i++){str=rnd(ss);f=rnd(fs);k=str+'-'+f;if(k!=last)break}last=k;target={t:str+' / '+f,s:`${str}-я струна • ${f==0?'открытая':f+' лад'}`,h:'Сыграй точку и дай ноте прозвучать',d:pointSvg(str,f,false)}}else{if(!st.scaleStrings.map(Number).filter(Boolean).length){warn('Не выбрана ни одна струна для гаммы.',true);target={t:'—',s:'выбери струны',h:'Тренажер не стартовал'};draw();return false}let n=nextScaleNote();if(!n){warn('В этом диапазоне нет нот выбранной гаммы. Расширь лады или струны.');target={t:'—',s:'нет нот',h:'Измени диапазон'};draw();return false}last=n.s+'-'+n.f;let inf=scaleInfo(),label=noteName(n.p)+(st.labels?' / '+ruNote(n.p):'');target={t:label,s:`${st.scaleRoot} ${inf.name} • ${n.s}-я струна • ${n.f==0?'открытая':n.f+' лад'}`,h:n.root?'Это тоника — опорная нота':'Нота из гаммы',d:pointSvg(n.s,n.f,true)}}draw();return true}

function audioOn(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state=='suspended')audio.resume()}function click(t,strong){if(!st.sound)return;audioOn();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=strong?1320:880;let v=st.vol/100*(strong?.18:.11);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.035);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.04)}
